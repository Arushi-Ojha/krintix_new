<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/krintix_new/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krintix | Premium AI Automation &amp; Cloud Optimization</title>
    <meta name="description" content="Repositioning business with cutting-edge AI automation and strategic cloud cost optimization. World-class engineering from India's tech hub." />

    <!-- Google Fonts: Inter, JetBrains Mono, Syne, Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Inline theme init: reads localStorage before React hydrates to avoid flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('krintix-theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/krintix_new/assets/index-BHB8lfed.js"></script>
    <link rel="stylesheet" crossorigin href="/krintix_new/assets/index-Dv5zxVe6.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
